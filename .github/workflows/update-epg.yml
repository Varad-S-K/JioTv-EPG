name: Update JioTV EPG

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build XMLTV files
        run: python build_epg.py --fail-on-errors

      - name: Commit updated XMLTV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jiotv.xml jiotv.xml.gz
          if git diff --cached --quiet; then
            echo "XMLTV files are already up to date."
          else
            git commit -m "chore: update JioTV XMLTV guide"
            git push
          fi
